<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Details - Aura Stay</title>
  <meta name="description" content="View luxury hotel details, resort amenities, and select available suites for booking.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="site-logo" id="brand-logo" aria-label="Aura Stay Homepage">
        <div class="logo-icon">✦</div>
        <span>AURA STAY</span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link" id="nav-explore">Explore Hotels</a></li>
          <li><a href="booking-history.html" class="nav-link" id="nav-bookings">My Bookings</a></li>
        </ul>
      </nav>

      <div class="user-profile-badge" id="user-badge" title="Active guest profile">
        <div class="user-avatar" id="user-avatar">SJ</div>
        <span id="user-name">Sarah Jenkins</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Breadcrumb back link -->
    <div class="breadcrumbs-bar">
      <a href="index.html" class="back-link" id="back-to-hotels">
        &larr; Back to all hotels
      </a>
    </div>

    <!-- Hotel Information Area (Populated by hotelDetails.js) -->
    <div id="hotel-details-container">
      <!-- Loading state placeholder -->
      <div class="state-container">
        <div class="loading-spinner"></div>
        <p class="state-title">Loading Hotel Details</p>
      </div>
    </div>

    <!-- Rooms Section -->
    <section class="rooms-section" id="rooms-section">
      <div class="section-header">
        <h2 class="section-title">Rooms & Suites</h2>
        <span id="rooms-count-badge" class="hotel-count-badge">Checking availability...</span>
      </div>

      <!-- Rooms list container -->
      <div id="rooms-list-container" class="rooms-list">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Aura Stay Hospitality Group. Clean, optimized hotel booking architecture.</p>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Dependencies & Page Module -->
  <script src="../node_modules/axios/dist/axios.min.js"></script>
  <script type="module" src="../js/hotelDetails.js"></script>
</body>
</html>
